<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">

    <title>Currency Converter</title>
</head>

<body>

    <div class="container">    
        <h1>Currency Converter</h1>

        <form>

            <div class="amount">
                <p>Enter Amount</p>
                <input value="100" type="number" min="0">
            </div>

            <div class="dropdown">

                <div class="from">
                    <p>From</p>

                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="flag">

                        <select name="from">
                        </select>
                    </div>
                </div>

                <i id="swap" class="fa-solid fa-arrow-right-arrow-left"></i>

                <div class="to">
                    <p>To</p>

                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="flag">

                        <select name="to">
                        </select>
                    </div>
                </div>

            </div>

            <div class="msg">
                <span>1 USD = 1 INR</span>
            </div>

            <button type="submit">Exchange</button>

        </form>

    </div>

    <script src="codes.js"></script>
    <script src="script.js"></script>

</body>
</html>
